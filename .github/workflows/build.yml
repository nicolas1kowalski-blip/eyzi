# Compilation et publication automatiques de « Eyzi ».
# À chaque poussée de code : compilation Windows, installeur, puis une
# version TEST (pré-version GitHub). Les tablettes en canal « test » la
# reçoivent ; le canal « prod » ne voit que les versions promues (non
# pré-version), promues d'un clic dans GitHub → Releases → « Edit » →
# décocher « Set as a pre-release » → « Set as the latest release ».
name: build

on:
  push:
    branches: [ main ]
    paths:
      - "desktop/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Identifiant de la voix naturelle hors ligne livrée (moteur + modèles). À changer quand on
  # change de moteur ou de voix : les tablettes retéléchargent alors l'installeur complet
  # une fois, puis repassent aux mises à jour légères.
  PACK_ID: piper-2023.11.14-2-siwis-upmc-v2
  # Identifiant du lot de pictogrammes ARASAAC livré (toute la banque). À changer pour
  # reconstituer le lot : les tablettes reprennent alors une fois l'installeur complet.
  PICTOS_ID: arasaac-2026.10.31-complet

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Numéro de version (AAAA.M.J.N)
        id: ver
        shell: pwsh
        run: |
          # Le dernier chiffre = numéro de compilation + 100, pour rester au-dessus des versions
          # publiées le même jour par l'ancien dépôt (les tablettes ne descendent jamais de version).
          $v = (Get-Date -Format "yyyy.M.d") + "." + ([int]$env:GITHUB_RUN_NUMBER + 100)
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compilation
        shell: pwsh
        run: |
          dotnet build desktop/MesPremiersJeux/MesPremiersJeux.csproj -c Release -p:Platform=x64 -p:Version=${{ steps.ver.outputs.version }} --nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem desktop/MesPremiersJeux/bin/x64/Release/net472 | Select-Object -First 5

      # Voix naturelle hors ligne : le moteur Piper (MIT) et la voix française
      # « siwis » (CC BY 4.0) sont téléchargés ici, pas gardés dans le dépôt
      # (85 Mo). Mis en cache d'une compilation à l'autre.
      - name: Voix naturelle hors ligne (cache)
        id: voix
        uses: actions/cache@v4
        with:
          path: voix-cache
          key: ${{ env.PACK_ID }}

      - name: Voix naturelle hors ligne (téléchargement)
        if: steps.voix.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force voix-cache | Out-Null
          Invoke-WebRequest -MaximumRetryCount 3 -Uri "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip" -OutFile voix-cache/piper.zip
          Invoke-WebRequest -MaximumRetryCount 3 -Uri "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx" -OutFile voix-cache/fr_FR-siwis-medium.onnx
          Invoke-WebRequest -MaximumRetryCount 3 -Uri "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx.json" -OutFile voix-cache/fr_FR-siwis-medium.onnx.json
          # Seconde voix féminine « jessica » (modèle upmc, locuteur 0 ; jeu de données UPMC sous CC BY-SA 4.0)
          Invoke-WebRequest -MaximumRetryCount 3 -Uri "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/fr/fr_FR/upmc/medium/fr_FR-upmc-medium.onnx" -OutFile voix-cache/fr_FR-upmc-medium.onnx
          Invoke-WebRequest -MaximumRetryCount 3 -Uri "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/fr/fr_FR/upmc/medium/fr_FR-upmc-medium.onnx.json" -OutFile voix-cache/fr_FR-upmc-medium.onnx.json
          Get-ChildItem voix-cache

      - name: Voix naturelle hors ligne (installation dans l'application)
        shell: pwsh
        run: |
          $dst = "desktop/MesPremiersJeux/bin/x64/Release/net472/Voix/piper"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Expand-Archive voix-cache/piper.zip -DestinationPath voix-tmp -Force
          Copy-Item voix-tmp/piper/* $dst -Recurse -Force
          Copy-Item voix-cache/fr_FR-siwis-medium.onnx* $dst -Force
          Copy-Item voix-cache/fr_FR-upmc-medium.onnx* $dst -Force
          if (-not (Test-Path "$dst/piper.exe") -or -not (Test-Path "$dst/fr_FR-siwis-medium.onnx")) { Write-Error "voix hors ligne incomplète"; exit 1 }
          # Piper est compilé avec Visual C++ : sur un Windows « nu », le runtime manque (VCRUNTIME140_1.dll introuvable).
          # On livre les trois DLL redistribuables à côté de piper.exe (déploiement « app-local », autorisé par Microsoft).
          $crt = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          foreach ($dll in @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")) {
            $src = if ($crt) { Join-Path $crt.FullName $dll } else { "C:\Windows\System32\$dll" }
            if (Test-Path $src) { Copy-Item $src $dst -Force } else { Write-Warning "runtime absent : $dll" }
          }
          if (-not (Test-Path "$dst/vcruntime140_1.dll")) { Write-Error "runtime Visual C++ non livré"; exit 1 }
          # L'identifiant de la voix livrée : l'application le compare à celui publié avec chaque version.
          Set-Content -Path "$dst/version.txt" -Value $env:PACK_ID -Encoding ascii -NoNewline
          "{0:N0} Mo" -f ((Get-ChildItem $dst -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      # Pictogrammes ARASAAC (CC BY-NC-SA) : l'index français complet et un noyau d'images,
      # constitués par desktop/tools/arasaac_core.py, mis en cache d'une compilation à l'autre.
      - name: Pictogrammes ARASAAC (cache)
        id: arasaac
        uses: actions/cache@v4
        with:
          path: arasaac-cache
          key: ${{ env.PICTOS_ID }}

      - name: Pictogrammes ARASAAC (index + noyau)
        if: steps.arasaac.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python desktop/tools/arasaac_core.py arasaac-cache all $env:PICTOS_ID
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Pictogrammes ARASAAC (installation dans l'application)
        shell: pwsh
        run: |
          $dst = "desktop/MesPremiersJeux/bin/x64/Release/net472/Images/arasaac"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item arasaac-cache/* $dst -Force
          if (-not (Test-Path "$dst/index.csv")) { Write-Error "ARASAAC absent"; exit 1 }
          Remove-Item "$dst/RESUME.txt" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force desktop/installer/Output | Out-Null
          Copy-Item arasaac-cache/RESUME.txt desktop/installer/Output/arasaac-resume.txt -ErrorAction SilentlyContinue
          Get-Content arasaac-cache/RESUME.txt -ErrorAction SilentlyContinue
          "{0:N0} fichiers, {1:N0} Mo" -f (Get-ChildItem $dst).Count, ((Get-ChildItem $dst | Measure-Object Length -Sum).Sum / 1MB)

      - name: Installeur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=${{ steps.ver.outputs.version }}" "/DSource=..\MesPremiersJeux\bin\x64\Release\net472" desktop\installer\Eyzi.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # L'installeur LÉGER (sans la voix hors ligne) : celui des mises à jour.
          & $iscc "/DVersion=${{ steps.ver.outputs.version }}" "/DSource=..\MesPremiersJeux\bin\x64\Release\net472" "/DLight=1" desktop\installer\Eyzi.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Archive portable + empreintes
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path desktop/MesPremiersJeux/bin/x64/Release/net472/* -DestinationPath "desktop/installer/Output/Eyzi-$v.zip"
          # Copie à nom fixe : https://github.com/nicolas1kowalski-blip/eyzi/releases/latest/download/Eyzi-Setup.exe
          Copy-Item "desktop/installer/Output/Eyzi-Setup-$v.exe" "desktop/installer/Output/Eyzi-Setup.exe"
          # Le nom de ce fichier dit quelle voix hors ligne accompagne la version (l'appli lit le nom, pas le contenu).
          Set-Content -Path "desktop/installer/Output/voix-$env:PACK_ID.txt" -Value $env:PACK_ID -Encoding ascii
          # Même chose pour les pictogrammes ARASAAC (lot complet, exclu de l'installeur léger).
          Set-Content -Path "desktop/installer/Output/pictos-$env:PICTOS_ID.txt" -Value $env:PICTOS_ID -Encoding ascii
          Get-ChildItem desktop/installer/Output/*.exe, desktop/installer/Output/*.zip | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
          }
          Get-ChildItem desktop/installer/Output

      # Le paquet du Microsoft Store (MSIX) : la même application, emballée pour le Store, qui la signe
      # lui-même (pas de certificat à acheter). Il ne sert qu'à la prod : on dépose ce fichier dans
      # l'espace partenaires Microsoft quand on promeut une version. Étape encore jeune : un échec ici
      # n'empêche pas la version test de sortir.
      # L'identité du paquet vient de l'espace partenaires (Identité du produit) ; à régler dans
      # GitHub → Settings → Secrets and variables → Actions → Variables : STORE_NAME, STORE_PUBLISHER,
      # STORE_PUBLISHER_DISPLAY. Sans elles, le paquet est fabriqué avec une identité provisoire
      # (bon pour vérifier la fabrication, pas pour le Store).
      - name: Paquet Microsoft Store (MSIX)
        continue-on-error: true
        shell: pwsh
        env:
          STORE_NAME: ${{ vars.STORE_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY: ${{ vars.STORE_PUBLISHER_DISPLAY }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $p = $v.Split('.')
          # Le Store exige un quatrième nombre à 0 : 2026.11.22.245 devient 2026.1122.245.0 (toujours croissant).
          $sv = "{0}.{1}{2:00}.{3}.0" -f $p[0], [int]$p[1], [int]$p[2], $p[3]
          $name = if ($env:STORE_NAME) { $env:STORE_NAME } else { "Eyzi.Provisoire" }
          $pub  = if ($env:STORE_PUBLISHER) { $env:STORE_PUBLISHER } else { "CN=Eyzi-Provisoire" }
          $disp = if ($env:STORE_PUBLISHER_DISPLAY) { $env:STORE_PUBLISHER_DISPLAY } else { "Eyzi" }
          Write-Host "Paquet Store $sv — identité $name / $pub"

          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $sdk = Get-ChildItem $kits -Directory | Where-Object { Test-Path (Join-Path $_.FullName "x64\makeappx.exe") } | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { Write-Error "makeappx.exe introuvable (SDK Windows)"; exit 1 }
          $makeappx = Join-Path $sdk.FullName "x64\makeappx.exe"
          $makepri  = Join-Path $sdk.FullName "x64\makepri.exe"

          # 1) La fiche du paquet et ses images, dans un petit dossier à part (c'est lui qu'indexe makepri).
          $pri = Join-Path $PWD "store-pri"
          Remove-Item $pri -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$pri\Assets" | Out-Null
          Copy-Item desktop/store/Assets/*.png "$pri\Assets"
          $manifest = (Get-Content desktop/store/AppxManifest.xml -Raw -Encoding UTF8).Replace('__NAME__', $name).Replace('__PUBLISHER__', $pub).Replace('__PUBLISHER_DISPLAY__', $disp).Replace('__VERSION__', $sv)
          [System.IO.File]::WriteAllText("$pri\AppxManifest.xml", $manifest, (New-Object System.Text.UTF8Encoding($false)))

          # 2) L'index des images (resources.pri) : sans lui, Windows ne trouve pas les tailles .scale-200, .targetsize-48…
          $cfg = Join-Path $PWD "store-priconfig.xml"
          & $makepri createconfig /cf $cfg /dq fr-FR /o
          if ($LASTEXITCODE -ne 0) { Write-Error "makepri createconfig"; exit 1 }
          # Un seul index pour tout le paquet : sans cela makepri range les tailles 200 % et 400 % dans des index à part.
          [xml]$c = Get-Content $cfg
          $c.SelectNodes('//packaging') | ForEach-Object { [void]$_.ParentNode.RemoveChild($_) }
          $c.Save($cfg)
          & $makepri new /pr $pri /cf $cfg /mn "$pri\AppxManifest.xml" /of "$pri\resources.pri" /o
          if ($LASTEXITCODE -ne 0) { Write-Error "makepri new"; exit 1 }

          # 3) La liste des fichiers : toute l'application (comme l'installeur complet), plus la fiche, l'index et les images.
          $src = (Resolve-Path "desktop/MesPremiersJeux/bin/x64/Release/net472").Path
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add('[Files]')
          Get-ChildItem $src -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($src.Length + 1)
            if ($rel -like '*.pdb' -or $rel -like '*.xml' -or $rel -like 'Contenu\*' -or $rel -like 'MiseAJour\*' -or $rel -eq 'resources.pri') { return }
            $lines.Add(('"{0}" "{1}"' -f $_.FullName, $rel))
          }
          $lines.Add(('"{0}" "AppxManifest.xml"' -f "$pri\AppxManifest.xml"))
          $lines.Add(('"{0}" "resources.pri"' -f "$pri\resources.pri"))
          Get-ChildItem "$pri\Assets" -File | ForEach-Object { $lines.Add(('"{0}" "Assets\{1}"' -f $_.FullName, $_.Name)) }
          $map = Join-Path $PWD "store-fichiers.txt"
          [System.IO.File]::WriteAllLines($map, $lines, (New-Object System.Text.UTF8Encoding($true)))
          Write-Host ("{0:N0} fichiers dans le paquet" -f ($lines.Count - 1))

          # 4) Le paquet. Il n'est pas signé : c'est le Store qui le signe à la publication.
          New-Item -ItemType Directory -Force desktop/installer/Output | Out-Null
          $out = Join-Path $PWD "desktop/installer/Output/Eyzi-Store-$v.msix"
          & $makeappx pack /f $map /p $out /o
          if ($LASTEXITCODE -ne 0) { Write-Error "makeappx pack"; exit 1 }
          "{0} : {1:N0} Mo (version Store {2})" -f (Split-Path $out -Leaf), ((Get-Item $out).Length / 1MB), $sv

      - name: Version test (pré-version GitHub)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Eyzi ${{ steps.ver.outputs.version }}
          prerelease: true
          body: |
            Version **test** ${{ steps.ver.outputs.version }} — compilée automatiquement depuis le dépôt `eyzi` (${{ github.sha }}).

            - `Eyzi-Setup-*.exe` : l'installeur complet, avec la voix naturelle hors ligne (par utilisateur, sans droits administrateur).
            - `Eyzi-Leger-*.exe` : l'installeur léger, sans la voix : celui que l'application télécharge pour se mettre à jour quand la voix installée est déjà la bonne (`voix-*.txt`).
            - `Eyzi-*.zip` : la version portable.
            - `Eyzi-Store-*.msix` : le paquet pour le Microsoft Store (non signé : il ne s'installe pas à la main, il se dépose dans l'espace partenaires Microsoft).
            - `*.sha256` : empreintes de contrôle, vérifiées par l'appli avant toute mise à jour.

            Pour la promouvoir en **prod** : Edit → décocher « Set as a pre-release » → cocher « Set as the latest release ».
          files: |
            desktop/installer/Output/*
