# Compilation et publication automatiques de « Eyzi ».
# À chaque poussée de code : compilation Windows, installeur, puis une
# version TEST (pré-version GitHub). Les tablettes en canal « test » la
# reçoivent ; le canal « prod » ne voit que les versions promues (non
# pré-version), promues d'un clic dans GitHub → Releases → « Edit » →
# décocher « Set as a pre-release » → « Set as the latest release ».
name: build

on:
  push:
    branches: [ main ]
    paths:
      - "desktop/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Numéro de version (AAAA.M.J.N)
        id: ver
        shell: pwsh
        run: |
          # Le dernier chiffre = numéro de compilation + 100, pour rester au-dessus des versions
          # publiées le même jour par l'ancien dépôt (les tablettes ne descendent jamais de version).
          $v = (Get-Date -Format "yyyy.M.d") + "." + ([int]$env:GITHUB_RUN_NUMBER + 100)
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compilation
        shell: pwsh
        run: |
          dotnet build desktop/MesPremiersJeux/MesPremiersJeux.csproj -c Release -p:Platform=x64 -p:Version=${{ steps.ver.outputs.version }} --nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem desktop/MesPremiersJeux/bin/x64/Release/net472 | Select-Object -First 5

      # Voix naturelle hors ligne : le moteur Piper (MIT) et la voix française
      # « siwis » (CC BY 4.0) sont téléchargés ici, pas gardés dans le dépôt
      # (85 Mo). Mis en cache d'une compilation à l'autre.
      - name: Voix naturelle hors ligne (cache)
        id: voix
        uses: actions/cache@v4
        with:
          path: voix-cache
          key: piper-2023.11.14-2-fr_FR-siwis-medium-v1

      - name: Voix naturelle hors ligne (téléchargement)
        if: steps.voix.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force voix-cache | Out-Null
          Invoke-WebRequest -MaximumRetryCount 3 -Uri "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip" -OutFile voix-cache/piper.zip
          Invoke-WebRequest -MaximumRetryCount 3 -Uri "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx" -OutFile voix-cache/fr_FR-siwis-medium.onnx
          Invoke-WebRequest -MaximumRetryCount 3 -Uri "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx.json" -OutFile voix-cache/fr_FR-siwis-medium.onnx.json
          Get-ChildItem voix-cache

      - name: Voix naturelle hors ligne (installation dans l'application)
        shell: pwsh
        run: |
          $dst = "desktop/MesPremiersJeux/bin/x64/Release/net472/Voix/piper"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Expand-Archive voix-cache/piper.zip -DestinationPath voix-tmp -Force
          Copy-Item voix-tmp/piper/* $dst -Recurse -Force
          Copy-Item voix-cache/fr_FR-siwis-medium.onnx* $dst -Force
          if (-not (Test-Path "$dst/piper.exe") -or -not (Test-Path "$dst/fr_FR-siwis-medium.onnx")) { Write-Error "voix hors ligne incomplète"; exit 1 }
          "{0:N0} Mo" -f ((Get-ChildItem $dst -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Installeur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=${{ steps.ver.outputs.version }}" "/DSource=..\MesPremiersJeux\bin\x64\Release\net472" desktop\installer\Eyzi.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Archive portable + empreintes
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path desktop/MesPremiersJeux/bin/x64/Release/net472/* -DestinationPath "desktop/installer/Output/Eyzi-$v.zip"
          # Copie à nom fixe : https://github.com/nicolas1kowalski-blip/eyzi/releases/latest/download/Eyzi-Setup.exe
          Copy-Item "desktop/installer/Output/Eyzi-Setup-$v.exe" "desktop/installer/Output/Eyzi-Setup.exe"
          Get-ChildItem desktop/installer/Output/*.exe, desktop/installer/Output/*.zip | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
          }
          Get-ChildItem desktop/installer/Output

      - name: Version test (pré-version GitHub)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Eyzi ${{ steps.ver.outputs.version }}
          prerelease: true
          body: |
            Version **test** ${{ steps.ver.outputs.version }} — compilée automatiquement depuis le dépôt `eyzi` (${{ github.sha }}).

            - `Eyzi-Setup-*.exe` : l'installeur (par utilisateur, sans droits administrateur).
            - `Eyzi-*.zip` : la version portable.
            - `*.sha256` : empreintes de contrôle, vérifiées par l'appli avant toute mise à jour.

            Pour la promouvoir en **prod** : Edit → décocher « Set as a pre-release » → cocher « Set as the latest release ».
          files: |
            desktop/installer/Output/*
