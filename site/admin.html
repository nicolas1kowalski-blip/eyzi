<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Eyzi · administration</title>
<link rel="icon" href="img/favicon.png">
<link rel="stylesheet" href="site.css">
<style>
  .wrap{max-width:980px;margin:0 auto;padding:28px 16px 60px}
  h1{font-size:28px;margin:0 0 6px}
  .sub{color:var(--muted);margin:0 0 18px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
  .tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:15px}
  .tabs button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
  .places{display:inline-block;background:#FFF4D6;border:1px solid #F3D98C;border-radius:999px;padding:8px 14px;font-weight:700;margin-left:auto}
  .req{margin-bottom:14px}
  .req h3{margin:0 0 4px;font-size:19px}
  .req .meta{color:var(--muted);font-size:14px;margin-bottom:8px}
  .req dl{display:grid;grid-template-columns:170px 1fr;gap:4px 12px;margin:0 0 10px;font-size:15px}
  .req dt{color:var(--muted)}
  .req dd{margin:0;white-space:pre-wrap}
  .mods{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:10px 0 4px;font-size:15px}
  .mods label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
  .req .key{font-family:ui-monospace,Consolas,monospace;font-size:17px;background:var(--code);padding:4px 10px;border-radius:8px}
  .acts{display:flex;gap:8px;flex-wrap:wrap}
  .acts button{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;font-size:15px}
  .mailbox{margin-top:12px;background:#fff;border:2px solid #7E3FF2;border-radius:14px;padding:12px}
  .mailbox .to{font-size:14px;color:#555;margin-bottom:6px}
  .mailbox input,.mailbox textarea{width:100%;box-sizing:border-box;border:1px solid #ccc;border-radius:8px;padding:8px;font:inherit;font-size:14px}
  .mailbox textarea{min-height:360px;margin-top:6px;line-height:1.4}
  .mailbox .acts{margin-top:8px}
  .ok{background:var(--ok);color:#fff}.no{background:#F3F6FC;color:var(--ink);border:1px solid var(--line)!important}.warn{background:#FDE8E6;color:var(--err)}
  .login{max-width:460px}
  .login input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font-size:16px;margin:8px 0 12px;box-sizing:border-box}
  .msg{padding:12px 14px;border-radius:12px;margin:10px 0;font-size:15px}
  .msg.err{background:#FDE8E6;color:#7F1D1D}.msg.ok{background:#E3F6E8;color:#14532D}
  .empty{color:var(--muted);padding:30px 0;text-align:center}
  /* Tableau de bord */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 16px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .tile b{display:block;font-size:26px;line-height:1.1}.tile span{font-size:13px;color:var(--muted)}
  .tile.warn b{color:#B45309}.tile.ok b{color:#15803D}
  table.grid{width:100%;border-collapse:collapse;font-size:14px}
  table.grid th{text-align:left;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.grid td{padding:7px 8px;border-bottom:1px solid #EEF1F7;vertical-align:top}
  table.grid tr:last-child td{border-bottom:0}
  .badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
  .b-ok{background:#E3F6E8;color:#14532D}.b-wait{background:#FFF4D6;color:#7C4A03}.b-off{background:#FDE8E6;color:#7F1D1D}.b-test{background:#EDE4FF;color:#4C1D95}.b-ia{background:#E0F2FE;color:#0C4A6E}
  details.sec{background:#fff;border:1px solid var(--line);border-radius:16px;padding:0;margin:0 0 12px}
  details.sec>summary{cursor:pointer;font-weight:800;font-size:17px;padding:14px 16px;list-style:none}
  details.sec>summary::-webkit-details-marker{display:none}
  details.sec>summary::before{content:'▸ ';color:var(--muted)}details.sec[open]>summary::before{content:'▾ '}
  details.sec>div{padding:0 16px 14px}
  details.fam{border:1px solid #EEF1F7;border-radius:12px;padding:0;margin:6px 0}
  details.fam>summary{cursor:pointer;padding:9px 12px;font-weight:600;list-style:none}
  details.fam>summary::-webkit-details-marker{display:none}
  details.fam>div{padding:0 12px 10px;font-size:14px}
  .sub2{color:var(--muted);font-size:13px;margin:0 0 8px}
</style>
</head>
<body>
<div class="top"><div class="in"><a class="brand" href="./"><img src="img/eyzi-logo-dark.png" alt="Eyzi"></a><nav><a href="licence.html">Formulaire</a><a class="hl" href="admin.html">🔒 Demandes</a></nav></div></div>

<div class="wrap">
  <h1>Demandes de licence</h1>
  <p class="sub">Page privée de l'éditeur. Valider crée la licence et l'envoie à la famille par e-mail ; refuser garde la trace.</p>

  <div id="login" class="card login">
    <b>Jeton d'accès</b>
    <p class="sub" style="margin:4px 0 0">La valeur de ADMIN_TOKEN dans Vercel. Gardée dans ce navigateur seulement.</p>
    <input id="token" type="password" placeholder="jeton secret" autocomplete="current-password">
    <button class="btn violet" id="enter" style="font-size:16px;padding:12px 22px">Entrer</button>
    <div id="lmsg"></div>
  </div>

  <div id="app" hidden>
    <div class="tabs">
      <button data-s="new" class="on">⏳ En attente</button>
      <button data-s="done">✅ Validées</button>
      <button data-s="refused">✕ Refusées</button>
      <button data-s="stats">📊 Tableau de bord</button>
      <span class="places" id="places">…</span>
      <button id="logout" style="margin-left:6px">Quitter</button>
    </div>
    <div id="gmsg"></div>
    <div id="list"></div>
  </div>
</div>

<script>
(function(){
  var token = ''; try { token = localStorage.getItem('eyzi_admin') || ''; } catch(e){}
  var status = 'new';
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function show(el, cls, text){ el.innerHTML = text ? '<div class="msg '+cls+'">'+esc(text)+'</div>' : ''; }
  async function api(method, body, qs){
    var r = await fetch('/api/admin'+(qs||''), { method: method, headers: {'Content-Type':'application/json','x-admin-token': token}, body: body ? JSON.stringify(body) : undefined });
    var j = {}; try { j = await r.json(); } catch(e){}
    if (r.status === 401) { throw new Error('Jeton incorrect.'); }
    if (!r.ok || !j.ok) throw new Error(j.message || ('Erreur '+r.status));
    return j;
  }
  function fmt(d){ try { return new Date(d).toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'}); } catch(e){ return d; } }
  function kindName(k){ return {famille:'Famille',etablissement:'Établissement',professionnel:'Professionnel'}[k]||k; }
  function render(j){
    $('places').textContent = 'Places bêta : '+j.places.used+' / '+j.places.total+' utilisées · '+j.places.left+' restante'+(j.places.left>1?'s':'')+(j.mail?'':' · ⚠ e-mails non configurés');
    var list = $('list'); list.innerHTML = '';
    if (!j.requests.length) { list.innerHTML = '<div class="empty">Rien ici pour le moment.</div>'; return; }
    j.requests.forEach(function(q){
      var isLic = q.topic === 'licence';
      var el = document.createElement('div'); el.className = 'card req';
      var rows = [
        ['E-mail', q.email ? '<a href="mailto:'+esc(q.email)+'">'+esc(q.email)+'</a>' : '—'],
        ['Profil', esc(kindName(q.kind)) + (q.org ? ' · '+esc(q.org) : '')],
        ['Enfant', esc(q.child||'—')], ['Commande oculaire', esc(q.gear||'—')],
        ['Tablettes', esc(q.tablets)], ['Recontact', q.recontact ? 'oui' : 'non'],
        ['Message', esc(q.message||'—')],
      ];
      if (q.licence_key) rows.push(['Licence', '<span class="key">'+esc(q.licence_key)+'</span>']);
      if (q.note) rows.push(['Note', esc(q.note)]);
      el.innerHTML = '<h3>'+(isLic?'🔑 ':'💬 ')+esc(q.name)+'</h3>'
        + '<div class="meta">'+(isLic?'Demande de licence':'Retour')+' · '+esc(fmt(q.created_at))+' · n° '+q.id+'</div>'
        + '<dl>'+rows.map(function(r){return '<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>';}).join('')+'</dl>'
        + '<div class="acts"></div><div class="rmsg"></div>';
      var acts = el.querySelector('.acts'), rmsg = el.querySelector('.rmsg');
      // Les mondes compris dans la licence (à la carte ; tout coché = licence complète).
      var mods = null;
      if (isLic) {
        mods = document.createElement('div'); mods.className = 'mods';
        var cur = (q.modules || 'jouer,apprendre,parler').split(',');
        mods.innerHTML = '<span>Mondes :</span>' + [['jouer','🎮 Jouer + 🎨 Créer'],['apprendre','🎓 Apprendre'],['parler','💬 Parler']].map(function(m){
          return '<label><input type="checkbox" value="'+m[0]+'"'+(cur.indexOf(m[0])>=0?' checked':'')+'> '+m[1]+'</label>';
        }).join('');
        acts.parentNode.insertBefore(mods, acts);
      }
      function chosen(){ return mods ? Array.prototype.map.call(mods.querySelectorAll('input:checked'), function(i){ return i.value; }) : null; }
      function btn(label, cls, fn){ var b=document.createElement('button'); b.className=cls; b.textContent=label; b.onclick=async function(){ b.disabled=true; try { await fn(); } catch(e){ show(rmsg,'err',e.message); } b.disabled=false; }; acts.appendChild(b); }
      // Le mail est relu (et corrigé si besoin) AVANT de partir : aperçu, puis bouton d'envoi.
      async function relire(kind, note, sendLabel, onSend){
        var old = el.querySelector('.mailbox'); if (old) old.remove();
        var p = await api('POST', {action:'preview', id:q.id, kind:kind, note:note});
        var box = document.createElement('div'); box.className = 'mailbox';
        box.innerHTML = '<div class="to">📧 À : <b>'+(p.to||'(pas d\'adresse)')+'</b>'+(p.configured?'':' · <span style="color:#b00">envoi impossible : SMTP non configuré</span>')+(kind==='licence'&&!q.licence_key?' · le numéro provisoire EYZ-XXXX-XXXX-XXXX-XXXX sera remplacé par le vrai numéro à l\'envoi':'')+'</div>'
          + '<input class="subj" value="'+(p.subject||'').replace(/"/g,'&quot;')+'">'
          + '<textarea class="body"></textarea><div class="acts"></div>';
        box.querySelector('.body').value = p.text || '';
        var a2 = box.querySelector('.acts');
        var send = document.createElement('button'); send.className='ok'; send.textContent = sendLabel;
        send.onclick = async function(){ send.disabled = true; try { await onSend({subject: box.querySelector('.subj').value, text: box.querySelector('.body').value}); } catch(e){ show(rmsg,'err',e.message); send.disabled=false; } };
        var cancel = document.createElement('button'); cancel.className='no'; cancel.textContent='Annuler'; cancel.onclick = function(){ box.remove(); };
        a2.appendChild(send); a2.appendChild(cancel);
        rmsg.parentNode.insertBefore(box, rmsg);
        box.querySelector('.body').focus();
      }
      if (q.status === 'new') {
        if (isLic) btn('✅ Valider : relire le mail, puis créer la licence et l\'envoyer', 'ok', async function(){
          var m = chosen(); if (m && !m.length) { show(rmsg,'err','Coche au moins un monde.'); return; }
          await relire('licence', '', '📧 Créer la licence et envoyer ce mail', async function(mail){
            var r = await api('POST', {action:'approve', id:q.id, modules:m, mail:mail});
            show(rmsg,'ok','Licence '+r.licence+(r.resent?' (déjà attribuée à cette adresse, renvoyée)':' créée')+(r.mailed?' et envoyée par e-mail.':'. E-mail NON envoyé : à transmettre à la main.'));
            setTimeout(load, 1200);
          });
        });
        if (isLic) btn('🔑 Créer la licence sans envoyer de mail', 'no', async function(){
          var m = chosen(); if (m && !m.length) { show(rmsg,'err','Coche au moins un monde.'); return; }
          var r = await api('POST', {action:'approve', id:q.id, modules:m, send:false});
          show(rmsg,'ok','Licence '+r.licence+' créée, aucun mail envoyé (bouton « Renvoyer le numéro » pour l\'envoyer plus tard).');
          setTimeout(load, 1200);
        });
        btn(isLic ? '✕ Refuser (relire l\'e-mail poli, puis l\'envoyer)' : '✓ Traité', isLic ? 'warn' : 'no', async function(){
          if (!isLic) { await api('POST', {action:'refuse', id:q.id, note:'', notify:false}); load(); return; }
          var note = prompt('Un mot pour la famille (facultatif, ajouté à l\'e-mail) :', '');
          if (note === null) return;
          await relire('refuse', note, '📧 Refuser et envoyer ce mail', async function(mail){
            await api('POST', {action:'refuse', id:q.id, note:note, notify:true, mail:mail});
            load();
          });
        });
        if (isLic) btn('✕ Refuser sans e-mail', 'no', async function(){ await api('POST', {action:'refuse', id:q.id, notify:false}); load(); });
      } else {
        if (q.licence_key) btn('💾 Enregistrer les mondes', 'no', async function(){
          var m = chosen(); if (!m.length) { show(rmsg,'err','Coche au moins un monde.'); return; }
          var r = await api('POST',{action:'modules', id:q.id, modules:m}); show(rmsg,'ok','Mondes de la licence : '+r.modules+' (pris en compte à la prochaine vérification de l\'application).');
        });
        if (q.licence_key) btn('📧 Renvoyer le numéro (relire d\'abord)', 'no', async function(){
          await relire('licence', '', '📧 Envoyer ce mail', async function(mail){
            var r = await api('POST',{action:'resend', id:q.id, mail:mail}); show(rmsg, r.mailed?'ok':'err', r.mailed?'Numéro renvoyé à '+q.email:'E-mail non envoyé (SMTP non configuré ?)');
            var b = el.querySelector('.mailbox'); if (b) b.remove();
          });
        });
        btn('↩ Remettre en attente', 'no', async function(){ await api('POST',{action:'reopen', id:q.id}); load(); });
      }
      list.appendChild(el);
    });
  }
  function mins(m){ m = Math.round(m||0); return m >= 90 ? (Math.round(m/6)/10)+' h' : m+' min'; }
  function daysAgo(d){ if(!d) return ''; var n = Math.round((Date.now() - new Date(d).getTime())/86400000); return n <= 0 ? "aujourd'hui" : n === 1 ? 'hier' : 'il y a '+n+' jours'; }
  function pct(a,b){ return b ? Math.round(100*a/b)+' %' : '—'; }
  function renderStats(j){
    var fam = j.familles || [], es = j.essais || [];
    var actives = fam.filter(function(f){ return f.active; });
    var inst = fam.filter(function(f){ return f.installee; });
    var tablettes = 0; fam.forEach(function(f){ tablettes += f.tablettes.filter(function(t){ return t.active; }).length; });
    var vues7 = fam.filter(function(f){ return f.derniere_ouverture && (Date.now()-new Date(f.derniere_ouverture).getTime()) < 7*86400000; }).length;
    var min30 = 0; j.trente.forEach(function(r){ min30 += +r.minutes||0; });
    var famActives30 = {}; j.trente.forEach(function(r){ famActives30[r.famille] = true; });
    var q30 = 0; fam.forEach(function(f){ if (f.ecoute) q30 += (f.ecoute.trente||{}).question||0; });
    var ia30 = 0, iaRefus30 = 0, iaTotal = 0; fam.forEach(function(f){ if (!f.ia) return; var t = f.ia.trente||{}; ia30 += (t.question||0)+(t.photo||0)+(t.spontane||0); iaRefus30 += t.refus||0; var a = f.ia.total||{}; iaTotal += (a.question||0)+(a.photo||0)+(a.spontane||0); });
    $('places').textContent = fam.length + ' licence' + (fam.length>1?'s':'') + ' · ' + inst.length + ' installée' + (inst.length>1?'s':'');
    var list = $('list'); list.innerHTML = '';

    // 1. Les chiffres clés.
    var tiles = document.createElement('div'); tiles.className = 'tiles';
    tiles.innerHTML = [
      ['<b>'+fam.length+'</b><span>licences créées</span>',''],
      ['<b>'+actives.length+'</b><span>actives · '+(fam.length-actives.length)+' désactivée'+(fam.length-actives.length>1?'s':'')+'</span>','ok'],
      ['<b>'+inst.length+'</b><span>installées · '+(fam.length-inst.length)+' pas encore</span>', fam.length-inst.length ? 'warn' : 'ok'],
      ['<b>'+tablettes+'</b><span>tablettes activées</span>',''],
      ['<b>'+vues7+'</b><span>familles vues cette semaine</span>',''],
      ['<b>'+Object.keys(famActives30).length+'</b><span>familles actives sur 30 jours · '+mins(min30)+'</span>',''],
      ['<b>'+fam.filter(function(f){ return f.ecoute && f.ecoute.azure_30; }).length+'</b><span>familles avec l\'écoute réglée (clé Azure, 30 j) · '+q30+' question'+(q30>1?'s':'')+' entendue'+(q30>1?'s':'')+'</span>',''],
      ['<b>'+ia30+'</b><span>appels à l\'IA sur 30 jours · '+iaTotal+' au total'+(iaRefus30?' · '+iaRefus30+' refus':'')+'</span>','ia'],
      ['<b>'+es.length+'</b><span>tablettes en essai 10 jours</span>',''],
    ].map(function(t){ return '<div class="tile '+t[1]+'">'+t[0]+'</div>'; }).join('');
    list.appendChild(tiles);

    // 2. Les licences, en tableau.
    function etat(f){
      if (!f.active) return '<span class="badge b-off">désactivée</span>';
      if (!f.installee) return '<span class="badge b-wait">pas installée</span>';
      var d = f.derniere_ouverture ? (Date.now()-new Date(f.derniere_ouverture).getTime())/86400000 : 999;
      return d < 7 ? '<span class="badge b-ok">active</span>' : d < 30 ? '<span class="badge b-wait">vue il y a '+Math.round(d)+' j</span>' : '<span class="badge b-off">silencieuse '+Math.round(d)+' j</span>';
    }
    function ecouteCell(f){
      if (!f.ecoute) return '—';
      var t = f.ecoute.trente||{};
      return (f.ecoute.azure_30 ? '<span class="badge b-ok">clé Azure</span> ' : '<span class="badge b-wait">sans clé</span> ') + (t.question||0) + ' question'+((t.question||0)>1?'s':'');
    }
    function iaCell(f){
      if (!f.ia) return f.ia_ouverte ? '<span class="badge b-ia">ouverte</span> 0' : '—';
      var t = f.ia.trente||{}, n = (t.question||0)+(t.photo||0)+(t.spontane||0);
      return (f.ia_ouverte ? '<span class="badge b-ia">ouverte</span> ' : '') + n + (t.refus ? ' · <span class="badge b-off">'+t.refus+' refus</span>' : '');
    }
    var sec = document.createElement('details'); sec.className = 'sec'; sec.open = true;
    sec.innerHTML = '<summary>🔑 Licences ('+fam.length+')</summary><div><p class="sub2">Classées par dernière ouverture. « IA 30 j » : appels à l\'IA de Parler ces 30 jours ; « ouverte » = licence de test ou dans la liste PARLER_LICENCES ; un refus = une famille prod qui a demandé l\'IA et ne l\'a pas eue (sa tablette a deviné seule).</p>'
      + '<table class="grid"><tr><th>Famille</th><th>État</th><th>Installée</th><th>Dernière ouverture</th><th>Tablettes</th><th>Version</th><th>Écoute 30 j</th><th>IA 30 j</th><th>Mondes</th></tr>'
      + fam.slice().sort(function(a,b){ return (b.derniere_ouverture||'').localeCompare(a.derniere_ouverture||''); }).map(function(f){
          return '<tr><td><b>'+esc(f.famille)+'</b>'+(f.canal==='test'?' <span class="badge b-test">test</span>':'')+'<br><small style="color:var(--muted)">'+esc(f.licence)+'</small></td>'
            + '<td>'+etat(f)+'</td>'
            + '<td>'+(f.installee ? esc(daysAgo(f.premiere_installation)) : '<small>créée '+esc(daysAgo(f.creee))+'</small>')+'</td>'
            + '<td>'+(f.derniere_ouverture ? esc(daysAgo(f.derniere_ouverture)) : '—')+'</td>'
            + '<td>'+f.tablettes.filter(function(t){return t.active;}).length+' / '+f.max_tablettes+'</td>'
            + '<td>'+esc(f.version||'—')+'</td>'
            + '<td>'+ecouteCell(f)+'</td>'
            + '<td>'+iaCell(f)+'</td>'
            + '<td><small>'+esc((f.mondes||'').replace(/,/g,', ')||'tous')+'</small></td></tr>';
        }).join('') + '</table></div>';
    list.appendChild(sec);

    // 3. L'écoute des familles : qui a réglé Azure, combien de questions, et d'où viennent les réponses.
    var avecEc = fam.filter(function(f){ return f.ecoute; });
    var se = document.createElement('details'); se.className = 'sec'; se.open = true;
    se.innerHTML = '<summary>👂 L\'écoute des familles ('+avecEc.filter(function(f){ return f.ecoute.azure_30; }).length+' avec une clé Azure sur 30 jours)</summary><div><p class="sub2">Compté sur la tablette et envoyé avec l\'usage : la clé Azure réglée (en jours), les questions entendues, les réponses choisies par l\'enfant, celles venues de l\'IA et celles devinées sans elle. Une famille « sans clé » n\'entend rien ; une famille avec des réponses devinées utilise l\'écoute sans coûter d\'IA. « Rebonds » : ce que l\'enfant a ajouté de lui-même après sa réponse. « À côté » : les fois où aucune case ne convenait (« Autre chose », « Pas ça »), en part des questions ; un taux élevé veut dire que les propositions enferment l\'enfant.</p>'
      + (avecEc.length ? '<table class="grid"><tr><th>Famille</th><th>Clé Azure</th><th>Questions</th><th>Réponses choisies</th><th>De l\'IA</th><th>Devinées</th><th>Rebonds</th><th>À côté</th><th>Tablettes</th><th>Dernière question</th></tr>'
        + avecEc.sort(function(a,b){ return (b.ecoute.dernier||'').localeCompare(a.ecoute.dernier||''); }).map(function(f){
            var t = f.ecoute.trente||{}, a = f.ecoute.total||{};
            function c(k){ return (t[k]||0)+' <small style="color:var(--muted)">/ '+(a[k]||0)+'</small>'; }
            var aCote = (t.autre||0)+(t.pasca||0), q = t.question||0;
            var taux = q ? Math.round(100*aCote/q) : 0;
            var cote = aCote ? aCote+' <small style="color:var(--muted)">('+taux+' % · '+(t.autre||0)+' autre chose, '+(t.pasca||0)+' pas ça'+((t.theme||0)?', '+(t.theme||0)+' mot'+((t.theme||0)>1?'s':'')+' de thème':'')+')</small>' : '0';
            return '<tr><td><b>'+esc(f.famille)+'</b></td><td>'+(f.ecoute.azure_30 ? '<span class="badge b-ok">oui</span> '+f.ecoute.azure_30+' j / 30' : f.ecoute.azure_jours ? '<span class="badge b-wait">plus maintenant</span>' : '<span class="badge b-off">non</span>')+'</td>'
              + '<td>'+c('question')+'</td><td>'+c('reponse')+'</td><td>'+c('ia')+'</td><td>'+c('devine')+'</td><td>'+c('rebond')+'</td><td>'+cote+'</td><td>'+f.ecoute.tablettes+'</td><td>'+esc(daysAgo(f.ecoute.dernier))+'</td></tr>';
          }).join('') + '</table><p class="sub2" style="margin-top:8px">Lecture : 30 derniers jours / depuis le début. Le compteur démarre avec la version 230 de l\'application sur la tablette.</p>'
        : '<p class="sub2">Rien pour le moment : il faut la version 230 ou plus sur les tablettes.</p>') + '</div>';
    list.appendChild(se);

    // 3 bis. L'IA de Parler, dans le détail.
    var avecIa = fam.filter(function(f){ return f.ia; });
    var si = document.createElement('details'); si.className = 'sec';
    si.innerHTML = '<summary>🤖 L\'IA de Parler ('+ia30+' appels sur 30 jours)</summary><div><p class="sub2">Chaque appel coûte de la reconnaissance vocale Azure côté famille et de l\'IA côté éditeur. Seules les licences de test et celles de la liste PARLER_LICENCES ('+(j.ia_liste||0)+' numéro'+(j.ia_liste>1?'s':'')+') y ont droit.</p>'
      + (avecIa.length ? '<table class="grid"><tr><th>Famille</th><th>Questions</th><th>Photos</th><th>Je veux dire</th><th>Refus</th><th>Total</th><th>Temps IA</th><th>Tablettes</th><th>Dernier appel</th></tr>'
        + avecIa.sort(function(a,b){ return (b.ia.dernier||'').localeCompare(a.ia.dernier||''); }).map(function(f){
            var t = f.ia.trente||{}, a = f.ia.total||{};
            function c(k){ return (t[k]||0)+' <small style="color:var(--muted)">/ '+(a[k]||0)+'</small>'; }
            return '<tr><td><b>'+esc(f.famille)+'</b>'+(f.ia_ouverte?' <span class="badge b-ia">ouverte</span>':'')+'</td><td>'+c('question')+'</td><td>'+c('photo')+'</td><td>'+c('spontane')+'</td><td>'+(t.refus?'<span class="badge b-off">'+t.refus+'</span>':'0')+' <small style="color:var(--muted)">/ '+(a.refus||0)+'</small></td>'
              + '<td>'+((t.question||0)+(t.photo||0)+(t.spontane||0))+' <small style="color:var(--muted)">/ '+((a.question||0)+(a.photo||0)+(a.spontane||0))+'</small></td><td>'+mins(f.ia.secondes/60)+'</td><td>'+f.ia.tablettes+'</td><td>'+esc(daysAgo(f.ia.dernier))+'</td></tr>';
          }).join('') + '</table><p class="sub2" style="margin-top:8px">Lecture : 30 derniers jours / depuis le début.</p>'
        : '<p class="sub2">Aucun appel à l\'IA enregistré pour le moment (le compteur démarre avec la version du serveur du 4 novembre).</p>') + '</div>';
    list.appendChild(si);

    // 4. Les activités, toutes familles.
    var agg = {}, aggAll = {};
    j.trente.forEach(function(r){ var a = agg[r.activite] = agg[r.activite] || {nom:r.nom||r.activite, minutes:0, ouvertures:0, familles:0}; a.minutes += +r.minutes||0; a.ouvertures += +r.ouvertures||0; a.familles++; });
    j.total.forEach(function(r){ var a = aggAll[r.activite] = aggAll[r.activite] || {nom:r.nom||r.activite, minutes:0, ouvertures:0, familles:0}; a.minutes += +r.minutes||0; a.ouvertures += +r.ouvertures||0; a.familles++; });
    var top = Object.keys(agg).map(function(k){ return agg[k]; }).sort(function(a,b){ return b.minutes-a.minutes; });
    var used = {}; j.total.forEach(function(r){ used[r.activite] = true; });
    var never = Object.keys(j.catalogue).filter(function(k){ return !used[k] && k.indexOf('onglet:') !== 0; }).map(function(k){ return j.catalogue[k]; }).sort();
    var rare = Object.keys(aggAll).map(function(k){ return aggAll[k]; }).filter(function(a){ return a.minutes < 10; }).sort(function(a,b){ return a.minutes-b.minutes; });
    var g = document.createElement('details'); g.className = 'sec';
    g.innerHTML = '<summary>🌍 Les activités, toutes familles (30 jours)</summary><div>'
      + (top.length ? '<table class="grid"><tr><th>Activité</th><th>Temps</th><th>Ouvertures</th><th>Familles</th></tr>' + top.slice(0, 20).map(function(a){ return '<tr><td>'+esc(a.nom)+'</td><td>'+mins(a.minutes)+'</td><td>'+a.ouvertures+'</td><td>'+a.familles+'</td></tr>'; }).join('') + '</table>' : '<p class="sub2">Rien ces 30 derniers jours.</p>')
      + '<p class="sub2" style="margin-top:10px"><b>Peu utilisées</b> (moins de 10 min au total) : ' + (rare.length ? rare.map(function(a){ return esc(a.nom)+' ('+mins(a.minutes)+')'; }).join(', ') : 'aucune') + '</p>'
      + '<p class="sub2"><b>Jamais ouvertes</b> par aucune famille : ' + (never.length ? never.map(esc).join(', ') : 'aucune') + '</p></div>';
    list.appendChild(g);

    // 5. Les essais sans licence.
    var te = document.createElement('details'); te.className = 'sec';
    te.innerHTML = '<summary>🧪 Essais sans licence ('+es.length+')</summary><div><p class="sub2">Tablettes qui utilisent l\'essai de 10 jours. Identifiant haché : on ne sait pas qui, seulement quoi et combien.</p>'
      + (es.length ? '<table class="grid"><tr><th>Tablette</th><th>Installé</th><th>Vu</th><th>Version</th><th>Temps</th><th>Jours</th><th>Activités</th></tr>' + es.map(function(m){
          return '<tr><td><small>'+esc(m.machine)+'</small></td><td>'+esc(daysAgo(m.depuis))+'</td><td>'+esc(daysAgo(m.vue))+'</td><td>'+esc(m.version||'?')+'</td><td>'+mins(m.minutes)+'</td><td>'+m.jours+'</td><td><small>'+m.top.map(function(a){ return esc(a.nom)+' ('+mins(a.minutes)+')'; }).join(', ')+'</small></td></tr>';
        }).join('') + '</table>' : '<p class="sub2">Aucun essai remonté pour le moment.</p>') + '</div>';
    list.appendChild(te);

    // 6. Le détail par famille, replié.
    var pf = document.createElement('details'); pf.className = 'sec';
    var inner = '';
    (j.resume||[]).forEach(function(f){
      var mine30 = j.trente.filter(function(r){ return r.famille === f.famille; }).sort(function(a,b){ return b.minutes-a.minutes; });
      var mineAll = j.total.filter(function(r){ return r.famille === f.famille; });
      var usedMine = {}; mineAll.forEach(function(r){ usedMine[r.activite] = true; });
      var nCat = Object.keys(j.catalogue).filter(function(k){ return k.indexOf('onglet:') !== 0; }).length;
      var neverMine = Object.keys(j.catalogue).filter(function(k){ return !usedMine[k] && k.indexOf('onglet:') !== 0; }).length;
      inner += '<details class="fam"><summary>👨‍👩‍👧 '+esc(f.famille)+' <small style="color:var(--muted);font-weight:400">· '+mins(f.minutes_total)+' au total · '+f.jours_utilises+' jour'+(f.jours_utilises>1?'s':'')+' · dernière fois '+(f.dernier_jour ? esc(daysAgo(f.dernier_jour)) : 'jamais')+'</small></summary><div>'
        + (mine30.length ? '<table class="grid"><tr><th>Activité (30 j)</th><th>Temps</th><th>Ouvertures</th><th>Réussites</th><th>Jours</th></tr>' + mine30.slice(0, 12).map(function(r){ return '<tr><td>'+esc(r.nom||r.activite)+'</td><td>'+mins(r.minutes)+'</td><td>'+r.ouvertures+'</td><td>'+(r.reussites||0)+'</td><td>'+r.jours+'</td></tr>'; }).join('') + '</table>' : '<p class="sub2">Rien ces 30 derniers jours.</p>')
        + '<p class="sub2" style="margin-top:8px">Activités jamais ouvertes par cette famille : '+neverMine+' sur '+nCat+'.</p></div></details>';
    });
    pf.innerHTML = '<summary>👨‍👩‍👧 Le détail par famille ('+(j.resume||[]).length+')</summary><div>' + (inner || '<p class="sub2">Aucune donnée d\'usage pour le moment.</p>') + '</div>';
    list.appendChild(pf);
  }
  async function load(){
    show($('gmsg'),'',''); $('list').innerHTML = '<div class="empty">Chargement…</div>';
    try {
      if (status === 'stats') renderStats(await api('GET', null, '?view=stats'));
      else render(await api('GET', null, '?status='+status));
    }
    catch(e){ show($('gmsg'),'err',e.message); $('list').innerHTML=''; if (/Jeton/.test(e.message)) logout(); }
  }
  function enter(){
    token = $('token').value.trim(); if (!token) return;
    try { localStorage.setItem('eyzi_admin', token); } catch(e){}
    $('login').hidden = true; $('app').hidden = false; load();
  }
  function logout(){ token=''; try{ localStorage.removeItem('eyzi_admin'); }catch(e){} $('app').hidden=true; $('login').hidden=false; }
  $('enter').onclick = enter;
  $('token').addEventListener('keydown', function(e){ if (e.key==='Enter') enter(); });
  $('logout').onclick = logout;
  document.querySelectorAll('.tabs button[data-s]').forEach(function(b){ b.onclick=function(){ document.querySelectorAll('.tabs button[data-s]').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); status=b.dataset.s; load(); }; });
  if (token) { $('login').hidden = true; $('app').hidden = false; load(); }
})();
</script>
</body>
</html>
