<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Eyzi · demandes</title>
<link rel="icon" href="img/favicon.png">
<link rel="stylesheet" href="site.css">
<style>
  .wrap{max-width:980px;margin:0 auto;padding:28px 16px 60px}
  h1{font-size:28px;margin:0 0 6px}
  .sub{color:var(--muted);margin:0 0 18px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
  .tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:15px}
  .tabs button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
  .places{display:inline-block;background:#FFF4D6;border:1px solid #F3D98C;border-radius:999px;padding:8px 14px;font-weight:700;margin-left:auto}
  .req{margin-bottom:14px}
  .req h3{margin:0 0 4px;font-size:19px}
  .req .meta{color:var(--muted);font-size:14px;margin-bottom:8px}
  .req dl{display:grid;grid-template-columns:170px 1fr;gap:4px 12px;margin:0 0 10px;font-size:15px}
  .req dt{color:var(--muted)}
  .req dd{margin:0;white-space:pre-wrap}
  .mods{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:10px 0 4px;font-size:15px}
  .mods label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
  .req .key{font-family:ui-monospace,Consolas,monospace;font-size:17px;background:var(--code);padding:4px 10px;border-radius:8px}
  .acts{display:flex;gap:8px;flex-wrap:wrap}
  .acts button{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;font-size:15px}
  .ok{background:var(--ok);color:#fff}.no{background:#F3F6FC;color:var(--ink);border:1px solid var(--line)!important}.warn{background:#FDE8E6;color:var(--err)}
  .login{max-width:460px}
  .login input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font-size:16px;margin:8px 0 12px;box-sizing:border-box}
  .msg{padding:12px 14px;border-radius:12px;margin:10px 0;font-size:15px}
  .msg.err{background:#FDE8E6;color:#7F1D1D}.msg.ok{background:#E3F6E8;color:#14532D}
  .empty{color:var(--muted);padding:30px 0;text-align:center}
</style>
</head>
<body>
<div class="top"><div class="in"><a class="brand" href="./"><img src="img/eyzi-logo-dark.png" alt="Eyzi"></a><nav><a href="licence.html">Formulaire</a><a class="hl" href="admin.html">🔒 Demandes</a></nav></div></div>

<div class="wrap">
  <h1>Demandes de licence</h1>
  <p class="sub">Page privée de l'éditeur. Valider crée la licence et l'envoie à la famille par e-mail ; refuser garde la trace.</p>

  <div id="login" class="card login">
    <b>Jeton d'accès</b>
    <p class="sub" style="margin:4px 0 0">La valeur de ADMIN_TOKEN dans Vercel. Gardée dans ce navigateur seulement.</p>
    <input id="token" type="password" placeholder="jeton secret" autocomplete="current-password">
    <button class="btn violet" id="enter" style="font-size:16px;padding:12px 22px">Entrer</button>
    <div id="lmsg"></div>
  </div>

  <div id="app" hidden>
    <div class="tabs">
      <button data-s="new" class="on">⏳ En attente</button>
      <button data-s="done">✅ Validées</button>
      <button data-s="refused">✕ Refusées</button>
      <button data-s="stats">📊 Statistiques</button>
      <span class="places" id="places">…</span>
      <button id="logout" style="margin-left:6px">Quitter</button>
    </div>
    <div id="gmsg"></div>
    <div id="list"></div>
  </div>
</div>

<script>
(function(){
  var token = ''; try { token = localStorage.getItem('eyzi_admin') || ''; } catch(e){}
  var status = 'new';
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function show(el, cls, text){ el.innerHTML = text ? '<div class="msg '+cls+'">'+esc(text)+'</div>' : ''; }
  async function api(method, body, qs){
    var r = await fetch('/api/admin'+(qs||''), { method: method, headers: {'Content-Type':'application/json','x-admin-token': token}, body: body ? JSON.stringify(body) : undefined });
    var j = {}; try { j = await r.json(); } catch(e){}
    if (r.status === 401) { throw new Error('Jeton incorrect.'); }
    if (!r.ok || !j.ok) throw new Error(j.message || ('Erreur '+r.status));
    return j;
  }
  function fmt(d){ try { return new Date(d).toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'}); } catch(e){ return d; } }
  function kindName(k){ return {famille:'Famille',etablissement:'Établissement',professionnel:'Professionnel'}[k]||k; }
  function render(j){
    $('places').textContent = 'Places bêta : '+j.places.used+' / '+j.places.total+' utilisées · '+j.places.left+' restante'+(j.places.left>1?'s':'')+(j.mail?'':' · ⚠ e-mails non configurés');
    var list = $('list'); list.innerHTML = '';
    if (!j.requests.length) { list.innerHTML = '<div class="empty">Rien ici pour le moment.</div>'; return; }
    j.requests.forEach(function(q){
      var isLic = q.topic === 'licence';
      var el = document.createElement('div'); el.className = 'card req';
      var rows = [
        ['E-mail', q.email ? '<a href="mailto:'+esc(q.email)+'">'+esc(q.email)+'</a>' : '—'],
        ['Profil', esc(kindName(q.kind)) + (q.org ? ' · '+esc(q.org) : '')],
        ['Enfant', esc(q.child||'—')], ['Commande oculaire', esc(q.gear||'—')],
        ['Tablettes', esc(q.tablets)], ['Recontact', q.recontact ? 'oui' : 'non'],
        ['Message', esc(q.message||'—')],
      ];
      if (q.licence_key) rows.push(['Licence', '<span class="key">'+esc(q.licence_key)+'</span>']);
      if (q.note) rows.push(['Note', esc(q.note)]);
      el.innerHTML = '<h3>'+(isLic?'🔑 ':'💬 ')+esc(q.name)+'</h3>'
        + '<div class="meta">'+(isLic?'Demande de licence':'Retour')+' · '+esc(fmt(q.created_at))+' · n° '+q.id+'</div>'
        + '<dl>'+rows.map(function(r){return '<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>';}).join('')+'</dl>'
        + '<div class="acts"></div><div class="rmsg"></div>';
      var acts = el.querySelector('.acts'), rmsg = el.querySelector('.rmsg');
      // Les mondes compris dans la licence (à la carte ; tout coché = licence complète).
      var mods = null;
      if (isLic) {
        mods = document.createElement('div'); mods.className = 'mods';
        var cur = (q.modules || 'jouer,apprendre,parler').split(',');
        mods.innerHTML = '<span>Mondes :</span>' + [['jouer','🎮 Jouer'],['apprendre','🎓 Apprendre'],['parler','💬 Parler']].map(function(m){
          return '<label><input type="checkbox" value="'+m[0]+'"'+(cur.indexOf(m[0])>=0?' checked':'')+'> '+m[1]+'</label>';
        }).join('');
        acts.parentNode.insertBefore(mods, acts);
      }
      function chosen(){ return mods ? Array.prototype.map.call(mods.querySelectorAll('input:checked'), function(i){ return i.value; }) : null; }
      function btn(label, cls, fn){ var b=document.createElement('button'); b.className=cls; b.textContent=label; b.onclick=async function(){ b.disabled=true; try { await fn(); } catch(e){ show(rmsg,'err',e.message); } b.disabled=false; }; acts.appendChild(b); }
      if (q.status === 'new') {
        if (isLic) btn('✅ Valider : créer la licence et l\'envoyer', 'ok', async function(){
          var m = chosen(); if (m && !m.length) { show(rmsg,'err','Coche au moins un monde.'); return; }
          var r = await api('POST', {action:'approve', id:q.id, modules:m});
          show(rmsg,'ok','Licence '+r.licence+(r.resent?' (déjà attribuée à cette adresse, renvoyée)':' créée')+(r.mailed?' et envoyée par e-mail.':'. E-mail NON envoyé : à transmettre à la main.'));
          setTimeout(load, 1200);
        });
        btn(isLic ? '✕ Refuser (e-mail poli à la famille)' : '✓ Traité', isLic ? 'warn' : 'no', async function(){
          var note = isLic ? (prompt('Un mot pour la famille (facultatif, ajouté à l\'e-mail) :', '') || '') : '';
          if (note === null) return;
          await api('POST', {action:'refuse', id:q.id, note:note, notify:isLic});
          load();
        });
        if (isLic) btn('✕ Refuser sans e-mail', 'no', async function(){ await api('POST', {action:'refuse', id:q.id, notify:false}); load(); });
      } else {
        if (q.licence_key) btn('💾 Enregistrer les mondes', 'no', async function(){
          var m = chosen(); if (!m.length) { show(rmsg,'err','Coche au moins un monde.'); return; }
          var r = await api('POST',{action:'modules', id:q.id, modules:m}); show(rmsg,'ok','Mondes de la licence : '+r.modules+' (pris en compte à la prochaine vérification de l\'application).');
        });
        if (q.licence_key) btn('📧 Renvoyer le numéro', 'no', async function(){ var r = await api('POST',{action:'resend', id:q.id}); show(rmsg, r.mailed?'ok':'err', r.mailed?'Numéro renvoyé à '+q.email:'E-mail non envoyé (SMTP non configuré ?)'); });
        btn('↩ Remettre en attente', 'no', async function(){ await api('POST',{action:'reopen', id:q.id}); load(); });
      }
      list.appendChild(el);
    });
  }
  function mins(m){ m = Math.round(m||0); return m >= 90 ? (Math.round(m/6)/10)+' h' : m+' min'; }
  function daysAgo(d){ if(!d) return ''; var n = Math.round((Date.now() - new Date(d).getTime())/86400000); return n <= 0 ? "aujourd'hui" : n === 1 ? 'hier' : 'il y a '+n+' jours'; }
  function renderStats(j){
    var fam = j.familles || [];
    var inst = fam.filter(function(f){ return f.installee; }).length;
    $('places').textContent = fam.length + ' licence' + (fam.length>1?'s':'') + ' · ' + inst + ' installée' + (inst>1?'s':'') + ' · ' + (fam.length - inst) + ' pas encore';
    var list = $('list'); list.innerHTML = '';
    // Installation : qui a installé, qui n'a pas encore commencé.
    var tbl = document.createElement('div'); tbl.className = 'card req';
    tbl.innerHTML = '<h3>📥 Installation par famille</h3><div class="meta">Une famille est « installée » dès que l\'application a été ouverte avec son numéro de licence.</div>'
      + '<dl>' + fam.sort(function(a,b){ return (b.derniere_ouverture||'').localeCompare(a.derniere_ouverture||''); }).map(function(f){
          var s = f.installee
            ? '✅ installée '+daysAgo(f.premiere_installation)+' · dernière ouverture '+daysAgo(f.derniere_ouverture)+' · version '+esc(f.version||'?')+' · '+f.tablettes.filter(function(t){return t.active;}).length+' / '+f.max_tablettes+' tablette'+(f.max_tablettes>1?'s':'')
            : '⏳ pas encore installée (licence créée '+daysAgo(f.creee)+')';
          if (!f.active) s += ' · 🚫 licence désactivée';
          return '<dt>'+esc(f.famille)+(f.canal==='test'?' <small>(test)</small>':'')+'</dt><dd>'+s+'</dd>';
        }).join('') + '</dl>';
    list.appendChild(tbl);
    // Essais sans licence (10 jours) : tablettes anonymes, identifiant haché.
    var es = j.essais || [];
    var te = document.createElement('div'); te.className = 'card req';
    te.innerHTML = '<h3>🧪 Essais sans licence</h3><div class="meta">Tablettes qui utilisent l\'essai de 10 jours. Identifiant haché : on ne sait pas qui, seulement quoi et combien.</div>'
      + (es.length ? '<dl>' + es.map(function(m){
          return '<dt>'+esc(m.machine)+'</dt><dd>'+(m.depuis ? 'installé '+daysAgo(m.depuis)+' · ' : '')+'vu '+daysAgo(m.vue)+' · version '+esc(m.version||'?')+' · '+mins(m.minutes)+' sur '+m.jours+' jour'+(m.jours>1?'s':'')
            + (m.top.length ? '<br><small>'+m.top.map(function(a){ return esc(a.nom)+' ('+mins(a.minutes)+')'; }).join(', ')+'</small>' : '')+'</dd>';
        }).join('') + '</dl>' : '<div class="meta">Aucun essai remonté pour le moment (nécessite une version 2026.10.24.141 ou plus sur la tablette).</div>');
    list.appendChild(te);
    if (!j.resume.length) { list.innerHTML += '<div class="empty">Aucune donnée d\'usage pour le moment.</div>'; return; }
    // Vue d'ensemble, toutes familles : 30 derniers jours par activité.
    var agg = {}, aggAll = {};
    j.trente.forEach(function(r){ var a = agg[r.activite] = agg[r.activite] || {nom:r.nom||r.activite, minutes:0, ouvertures:0, familles:0}; a.minutes += +r.minutes||0; a.ouvertures += +r.ouvertures||0; a.familles++; });
    j.total.forEach(function(r){ var a = aggAll[r.activite] = aggAll[r.activite] || {nom:r.nom||r.activite, minutes:0, ouvertures:0, familles:0}; a.minutes += +r.minutes||0; a.ouvertures += +r.ouvertures||0; a.familles++; });
    var top = Object.keys(agg).map(function(k){ return agg[k]; }).sort(function(a,b){ return b.minutes-a.minutes; });
    var used = {}; j.total.forEach(function(r){ used[r.activite] = true; });
    var never = Object.keys(j.catalogue).filter(function(k){ return !used[k] && k.indexOf('onglet:') !== 0; }).map(function(k){ return j.catalogue[k]; }).sort();
    var rare = Object.keys(aggAll).map(function(k){ return aggAll[k]; }).filter(function(a){ return a.minutes < 10; }).sort(function(a,b){ return a.minutes-b.minutes; });
    var g = document.createElement('div'); g.className = 'card req';
    g.innerHTML = '<h3>🌍 Toutes les familles</h3><div class="meta">30 derniers jours · minutes cumulées, nombre d\'ouvertures, nombre de familles</div>'
      + '<dl>' + top.slice(0, 15).map(function(a){ return '<dt>'+esc(a.nom)+'</dt><dd>'+mins(a.minutes)+' · '+a.ouvertures+' ouverture'+(a.ouvertures>1?'s':'')+' · '+a.familles+' famille'+(a.familles>1?'s':'')+'</dd>'; }).join('') + '</dl>'
      + '<div class="meta" style="margin-top:10px"><b>Peu utilisées</b> (moins de 10 min au total, toutes familles) : ' + (rare.length ? rare.map(function(a){ return esc(a.nom)+' ('+mins(a.minutes)+')'; }).join(', ') : 'aucune') + '</div>'
      + '<div class="meta"><b>Jamais ouvertes</b> par aucune famille : ' + (never.length ? never.map(esc).join(', ') : 'aucune') + '</div>';
    list.appendChild(g);
    // Par famille.
    j.resume.forEach(function(f){
      var mine30 = j.trente.filter(function(r){ return r.famille === f.famille; }).sort(function(a,b){ return b.minutes-a.minutes; });
      var mineAll = j.total.filter(function(r){ return r.famille === f.famille; });
      var usedMine = {}; mineAll.forEach(function(r){ usedMine[r.activite] = true; });
      var neverMine = Object.keys(j.catalogue).filter(function(k){ return !usedMine[k] && k.indexOf('onglet:') !== 0; }).length;
      var el = document.createElement('div'); el.className = 'card req';
      el.innerHTML = '<h3>👨‍👩‍👧 '+esc(f.famille)+'</h3>'
        + '<div class="meta">'+mins(f.minutes_total)+' au total · '+f.jours_utilises+' jour'+(f.jours_utilises>1?'s':'')+' d\'utilisation · dernière fois : '+(f.dernier_jour ? esc(fmt(f.dernier_jour).split(' ')[0]) : 'jamais')+' · tablettes : '+f.tablettes_actives+' / '+f.max_tablettes+'</div>'
        + (mine30.length ? '<dl>' + mine30.slice(0, 10).map(function(r){ return '<dt>'+esc(r.nom||r.activite)+'</dt><dd>'+mins(r.minutes)+' · '+r.ouvertures+' ouverture'+(r.ouvertures>1?'s':'')+(r.reussites ? ' · '+r.reussites+' réussite'+(r.reussites>1?'s':'') : '')+' · '+r.jours+' jour'+(r.jours>1?'s':'')+'</dd>'; }).join('') + '</dl>' : '<div class="meta">Rien ces 30 derniers jours.</div>')
        + '<div class="meta">Activités jamais ouvertes par cette famille : '+neverMine+' sur '+Object.keys(j.catalogue).filter(function(k){ return k.indexOf('onglet:') !== 0; }).length+'</div>';
      list.appendChild(el);
    });
  }
  async function load(){
    show($('gmsg'),'',''); $('list').innerHTML = '<div class="empty">Chargement…</div>';
    try {
      if (status === 'stats') renderStats(await api('GET', null, '?view=stats'));
      else render(await api('GET', null, '?status='+status));
    }
    catch(e){ show($('gmsg'),'err',e.message); $('list').innerHTML=''; if (/Jeton/.test(e.message)) logout(); }
  }
  function enter(){
    token = $('token').value.trim(); if (!token) return;
    try { localStorage.setItem('eyzi_admin', token); } catch(e){}
    $('login').hidden = true; $('app').hidden = false; load();
  }
  function logout(){ token=''; try{ localStorage.removeItem('eyzi_admin'); }catch(e){} $('app').hidden=true; $('login').hidden=false; }
  $('enter').onclick = enter;
  $('token').addEventListener('keydown', function(e){ if (e.key==='Enter') enter(); });
  $('logout').onclick = logout;
  document.querySelectorAll('.tabs button[data-s]').forEach(function(b){ b.onclick=function(){ document.querySelectorAll('.tabs button[data-s]').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); status=b.dataset.s; load(); }; });
  if (token) { $('login').hidden = true; $('app').hidden = false; load(); }
})();
</script>
</body>
</html>
